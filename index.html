<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾字</title>
<link rel="icon" href="assets/app-icon.png">
<style>
  :root { color-scheme: light; }
  body { margin:0; padding:0; font-family:-apple-system,"PingFang TC",sans-serif; background:#faf6ed; color:#2b2620; }
  main { max-width:720px; margin:0 auto; padding:56px 24px 80px; text-align:center; }
  .icon { width:96px; height:96px; border-radius:22px; box-shadow:0 6px 20px rgba(178,58,46,0.25); margin-bottom:22px; }
  h1 { font-size:28px; margin:0 0 8px; }
  .tagline { color:#6b6459; font-size:15px; line-height:1.7; max-width:420px; margin:0 auto; }
  .shots { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:44px 0 8px; }
  .shots img { width:180px; border-radius:18px; border:1px solid #e4ddce; box-shadow:0 8px 24px rgba(43,38,32,0.10); }
  .links { margin-top:44px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  a.card { display:block; width:100%; max-width:320px; padding:14px 20px; background:#fffdf8; border:1px solid #e4ddce; border-radius:10px; color:#2b2620; text-decoration:none; font-weight:600; }
  a.card:hover { border-color:#b23a2e; }
  footer { color:#a89e8c; font-size:12px; margin-top:56px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="assets/app-icon.png" alt="拾字 App 圖示">
  <h1>拾字</h1>
  <p class="tagline">裝置端 AI 字根拆解 × 圖像聯想記憶法，背單字不死記。完全離線運算，不需要網路，不需要註冊帳號。</p>

  <div class="shots">
    <img src="assets/shot-stats.png" alt="學習統計畫面：連續打卡、成就徽章、字彙分布圖表">
    <img src="assets/shot-quickuse.png" alt="馬上用畫面：搜尋任意單字並加入學習清單">
    <img src="assets/shot-quiz.png" alt="考考測驗畫面：自由練習選擇題">
  </div>

  <div class="links">
    <a class="card" href="privacy.html">隱私權政策</a>
    <a class="card" href="support.html">支援與常見問題</a>
  </div>

  <footer>拾字 · 2026</footer>
</main>
</body>
</html>
